# Abhaengigkeits-Aktualisierungen. / Dependency updates.
#
# WARUM `target-branch: dev` UEBERALL (#554): Ohne diesen Schluessel nimmt Dependabot den
# Standard-Branch des Repositories, also `main` — und dort wird nicht entwickelt. Der Weg
# ist `dev` -> Release-PR -> `main`; ein Abhaengigkeits-PR nach `main` gemergt setzt
# Aenderungen in einen Branch, der sie an `dev` vorbei traegt. Genau die Abweichung, die der
# Release-Weg vermeiden soll.
#
# Gemessen am 2026-08-13: `dev` war 53 Commits vor `main`, `main` hatte keinen eigenen — und
# elf Dependabot-PRs standen gleichzeitig gegen `main` offen.
#
# NICHT „aufraeumen": Der Schluessel sieht ueberfluessig aus, solange man den Standard-Branch
# fuer den Arbeits-Branch haelt. Er ist es nicht.
#
# EN: without target-branch, Dependabot opens against the repository default branch (`main`),
# where nothing is developed — releases flow dev -> release PR -> main, so a dependency PR
# merged into main carries changes past dev. Measured 2026-08-13: dev was 53 commits ahead,
# main had none of its own, and eleven such PRs were open at once. Not redundant; do not tidy
# it away.
#
# WARUM `groups` (#585): Ein PR je Abhaengigkeit ist hier ueberdurchschnittlich teuer. Das
# Ruleset auf `dev` traegt `strict_required_status_checks_policy: true`, und Auto-Merge ist
# im Repository abgeschaltet — jeder Merge setzt also ALLE uebrigen Dependabot-PRs zurueck
# auf `BEHIND`, und jeder braucht danach eine eigene Runde aus Nachziehen und voller CI.
#
# Gemessen am 2026-08-14 an sechs offenen PRs (#566-#571): 106 s, 259 s, 453 s, 627 s, 779 s
# bis `CLEAN`, danach fuer #571 ein echter Merge-Konflikt, weil die frueheren Bumps
# benachbarte Zeilen derselben Workflow-Dateien angefasst hatten. Rund 40 Minuten und sechs
# volle CI-Laeufe fuer sechs einzeilige Versionsspruenge.
#
# WARUM ZWEI GRUPPEN JE OEKOSYSTEM statt einer: Ein Hauptversionssprung kann brechen — heute
# waren vier der sechs welche, und jeder brauchte einen Blick in die Release-Notes (entfernte
# Eingaben, geaenderte Laufzeit). Lieber die harmlosen minor/patch geschlossen durchwinken und
# die Majors zusammen, aber getrennt davon pruefen: Ein rotes Major blockiert dann nicht die
# uebrigen Aktualisierungen, und ein Rueckbau trifft nur seine Gruppe.
#
# EN: one PR per dependency is expensive here — `dev` requires branches to be up to date and
# auto-merge is disabled, so every merge sends the remaining PRs back to `BEHIND` and each
# needs its own update + full CI round. Measured 2026-08-14 across #566-#571: ~40 minutes and
# six CI runs for six one-line bumps, plus one real conflict between adjacent lines. Two
# groups per ecosystem, not one: majors can break (four of those six were majors), so they
# travel together but apart from minor/patch — a red major then blocks only its own group.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-major:
        patterns: ["*"]
        update-types: ["major"]
