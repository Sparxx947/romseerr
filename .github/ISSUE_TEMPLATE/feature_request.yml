name: Feature request / Funktionswunsch
description: Suggest an idea / Eine Idee vorschlagen
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Keine Inhaltsquellen.** Fragen nach Bezugsquellen für Spiele, ROMs, BIOS
        oder Firmware werden geschlossen — Romseerr ist Werkzeug, die Quellen trägt
        der Betreiber selbst ein. Siehe [CONTRIBUTING](../blob/main/.github/CONTRIBUTING.md).
        **No content sources.** Requests for where to obtain games, ROMs, BIOS or
        firmware are closed — Romseerr is tooling; sources are the operator's own.
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Welches Problem löst das? / What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / Lösungsvorschlag
      description: Wie sollte es funktionieren? / How should it work?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / Alternativen
    validations:
      required: false
