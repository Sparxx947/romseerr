# OpenSSF Scorecard — die Prüfliste, die diese Härtung ausgelöst hat, läuft ab jetzt
# selbst mit. Sie bewertet Lieferkette und Projekthygiene: gepinnte Actions, Rechte der
# Workflows, Schutzregeln der Zweige, gefährliche Muster in Workflows, gepflegte
# Abhängigkeiten. Ergebnisse landen im Code-Scanning des Repos.
#
# WARUM ALS EIGENER LAUF UND NICHT EINMALIG VON HAND: Eine Prüfliste, die einmal
# abgehakt wurde, verfällt lautlos. Der nächste bequeme Griff — eine Action schnell auf
# ein Tag zurück, eine Berechtigung „nur zum Testen" — fällt dann niemandem mehr auf.
#
# Runs the same checklist that prompted this hardening, so it cannot quietly decay.
name: Scorecard

# KEIN `push`-Ausloeser (#369): `ossf/scorecard-action` bricht auf jedem anderen Zweig als
# dem Standardzweig ab — „Only the default branch main is supported." Hier stand
# `push: branches: [dev]`, und damit scheiterte JEDER Push, 30 von 30 zuletzt. Ein
# Ausloeser, der nie ein Ergebnis liefern kann, ist kein Ausloeser, sondern eine dauerhaft
# rote Meldung — und die liest nach der zweiten Woche niemand mehr.
#
# Was bleibt, laeuft alles auf dem Standardzweig und damit erfolgreich: der Wochenlauf
# (zuletzt gruen), Aenderungen am Zweigschutz, und der Aufruf von Hand.
#
# No push trigger: the action only runs on the default branch, so every push to dev failed
# by construction. What remains all runs on the default branch.
on:
  branch_protection_rule:
  schedule:
    - cron: "30 5 * * 1"     # montags / Mondays
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard-Analyse / analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # Ergebnis ins Code-Scanning
      id-token: write          # signierter Nachweis des Laufs
      contents: read
      actions: read
    steps:
      # NUR AUF DEM STANDARDZWEIG — und das ÜBERSPRINGEN statt fehlschlagen. (#470)
      #
      # `ossf/scorecard-action` weist jeden anderen Zweig ab („Only the default branch is
      # supported"). Der `push`-Auslöser wurde deshalb entfernt (#369), aber
      # `workflow_dispatch` reißt dasselbe Loch von der anderen Seite auf: Ein Aufruf mit
      # `--ref dev` scheitert zwangsläufig, und danach steht der Workflow auf ROT — bis zum
      # nächsten Wochenlauf, für alle sichtbar, ohne dass jemand etwas tun könnte.
      #
      # Genau so passiert am 2026-08-12: ein `gh workflow run scorecard.yml --ref dev`, und
      # die Gesamtprüfung meldete tagelang „Workflow rot und seither nie grün".
      #
      # Ein roter Workflow, gegen den niemand etwas tun kann, ist schlimmer als keiner: Nach
      # der zweiten Woche liest ihn niemand mehr, und ein echter Fehlschlag geht darin unter.
      # Deshalb wird ein falsch gerichteter Aufruf GRÜN beendet, mit klarer Ansage.
      #
      # EN: the action rejects any non-default branch. A dispatch with --ref dev fails by
      # construction and leaves the workflow red until the next scheduled run. Skip with a
      # message instead — the run was misdirected, not broken.
      - name: Nur der Standardzweig / default branch only
        id: zweig
        run: |
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "uebersprungen=ja" >> "$GITHUB_OUTPUT"
            echo "::notice::Scorecard läuft nur auf '${{ github.event.repository.default_branch }}';" \
                 "angefordert war '${{ github.ref_name }}'. Nichts gemessen, nichts kaputt."
          else
            echo "uebersprungen=nein" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.zweig.outputs.uebersprungen == 'nein'
        with:
          persist-credentials: false

      - name: Scorecard
        if: steps.zweig.outputs.uebersprungen == 'nein'
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Ohne Token laufen die Prüfungen, die die GitHub-API brauchen (Zweigschutz,
          # Mitwirkende), gar nicht erst — sie melden dann "keine Daten" statt eines
          # Befunds. Ein reines Lesetoken genügt; ohne es ist die Bewertung geschönt.
          # Without a token the API-based checks silently report "no data" rather than
          # a finding, which flatters the score.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: false

      - name: Ergebnis aufbewahren / keep the result
        if: steps.zweig.outputs.uebersprungen == 'nein'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Ins Code-Scanning / upload to code scanning
        if: steps.zweig.outputs.uebersprungen == 'nein'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v3
        with:
          sarif_file: results.sarif
