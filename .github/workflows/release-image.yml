# Baut ein Multi-Arch-Image (amd64 + arm64) und pusht es nach GHCR.
# Builds a multi-arch image (amd64 + arm64) and pushes it to GHCR.
#
# WARUM KEIN `on: release` MEHR: Ein Release, das release-please mit dem Standard-
# `GITHUB_TOKEN` anlegt, loest KEINE weiteren Workflows aus — GitHubs Sperre dagegen,
# dass Workflows sich selbst ausloesen. `on: release: [published]` konnte fuer einen
# solchen Release also nie feuern; der Kopf dieser Datei behauptete das Gegenteil, und
# v1.1.0-beta.1 erschien folgerichtig ohne Abbild. (#185)
#
# Gewaehlt wurde Weg 2 aus dem Issue: `release-please.yml` ruft diesen Workflow direkt
# auf (`workflow_call`), sobald es ein Release erzeugt hat. Ein PAT oder eine GitHub App
# (Weg 1) haette dieselbe Wirkung, kostet aber ein dauerhaftes Geheimnis mehr — in einem
# Projekt, das Schluesselmaterial sonst konsequent klein haelt, ist das der teurere
# Handel. Weg 3 (nur den manuellen Weg reparieren) laesst „jemand muss daran denken"
# stehen, und genau daran ist es schon einmal gescheitert.
#
# EN: a release created with the default GITHUB_TOKEN does not trigger further workflows,
# so `on: release` could never fire here. release-please now calls this workflow directly.
name: Publish image

on:
  workflow_call:
    inputs:
      ref:
        description: Commit oder Tag, aus dem gebaut wird / commit or tag to build from
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Tag oder Commit (leer = aktueller Zweig) / tag or commit (empty = current branch)
        required: false
        type: string

# OBEN NUR LESEN. Der einzige Job nennt seine Schreibrechte selbst. (#434)
permissions:
  contents: read


jobs:
  publish:
    # packages: veroeffentlicht das Abbild. id-token + attestations: die signierte
    # Herkunftsbescheinigung — Sigstore signiert mit einem kurzlebigen OIDC-Token, damit
    # nirgends ein dauerhafter Schluessel liegen muss. (#434)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    name: Build & push (GHCR, multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref || github.ref_name }}
            # `latest` nur für stabile Releases — ein Pre-Release darf es nicht verschieben.
            #
            # Die Bedingung haengt jetzt am VERSIONSNAMEN statt am Ausloeser. Vorher stand
            # dort `github.event_name != 'release' || …`: bei einem Lauf von Hand war die
            # erste Haelfte wahr, und `latest` landete auf einer Beta — genau das, was der
            # Kommentar darueber ausschloss. Der Notnagel tauschte damit ein fehlendes
            # Abbild gegen ein irrefuehrendes. SemVer kennzeichnet Vorabversionen mit
            # einem `-`, das ist unabhaengig davon, wer den Lauf angestossen hat. (#185)
            #
            # EN: the guard now keys on the version string, not the trigger. On a manual
            # run the old condition was true and `latest` moved to a pre-release.
            type=raw,value=latest,enable=${{ !contains(inputs.ref || github.ref_name, '-') }}

      - name: Build timestamp
        id: build
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          # Stueckliste mit ins Register: was steckt im Image?
          # Software bill of materials, pushed alongside the image.
          sbom: true
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build-Herkunft ins Image spritzen -> /api/version meldet Commit + Bauzeitpunkt
          build-args: |
            ROMSEERR_COMMIT=${{ github.sha }}
            ROMSEERR_BUILT_AT=${{ steps.build.outputs.at }}
          # BuildKits eigene Provenance bleibt aus — sie erzeugt zusaetzliche
          # Manifest-Eintraege, die manche Registry-Oberflaechen verwirren. Die
          # belastbare Bescheinigung kommt stattdessen im naechsten Schritt und
          # laesst sich mit `gh attestation verify` pruefen.
          # BuildKit's own provenance stays off; the verifiable attestation is
          # produced below instead.
          provenance: false

      # Beweist nachtraeglich pruefbar, aus welchem Commit und welchem Lauf dieses
      # Image stammt — ohne dass irgendwo ein dauerhafter Schluessel liegt:
      #
      #   gh attestation verify oci://ghcr.io/<owner>/romseerr:<tag> --repo <owner>/romseerr
      #
      # Proves which commit and which run produced this image, with no long-lived key.
      - name: Herkunft bescheinigen / attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
