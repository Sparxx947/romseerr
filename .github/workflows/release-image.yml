# Baut bei jedem veröffentlichten Release ein Multi-Arch-Image (amd64 + arm64) und pusht es
# nach GHCR. / Builds a multi-arch image (amd64 + arm64) and pushes it to GHCR on each release.
# release-please erzeugt das Release (Tag vX.Y.Z), was diesen Workflow auslöst.
name: Publish image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Fuer die signierte Herkunftsbescheinigung: id-token holt das kurzlebige
  # OIDC-Token, mit dem Sigstore ohne dauerhaften Schluessel signiert.
  # For the signed provenance attestation; Sigstore signs with a short-lived
  # OIDC token, so no long-lived key has to exist anywhere.
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build & push (GHCR, multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` nur für stabile Releases setzen — ein Pre-Release (Beta) darf
            # es nicht verschieben. (metadata-action überspringt major.minor bei Pre-Releases automatisch.)
            type=raw,value=latest,enable=${{ github.event_name != 'release' || !github.event.release.prerelease }}

      - name: Build timestamp
        id: build
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          # Stueckliste mit ins Register: was steckt im Image?
          # Software bill of materials, pushed alongside the image.
          sbom: true
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build-Herkunft ins Image spritzen -> /api/version meldet Commit + Bauzeitpunkt
          build-args: |
            ROMSEERR_COMMIT=${{ github.sha }}
            ROMSEERR_BUILT_AT=${{ steps.build.outputs.at }}
          # BuildKits eigene Provenance bleibt aus — sie erzeugt zusaetzliche
          # Manifest-Eintraege, die manche Registry-Oberflaechen verwirren. Die
          # belastbare Bescheinigung kommt stattdessen im naechsten Schritt und
          # laesst sich mit `gh attestation verify` pruefen.
          # BuildKit's own provenance stays off; the verifiable attestation is
          # produced below instead.
          provenance: false

      # Beweist nachtraeglich pruefbar, aus welchem Commit und welchem Lauf dieses
      # Image stammt — ohne dass irgendwo ein dauerhafter Schluessel liegt:
      #
      #   gh attestation verify oci://ghcr.io/<owner>/romseerr:<tag> --repo <owner>/romseerr
      #
      # Proves which commit and which run produced this image, with no long-lived key.
      - name: Herkunft bescheinigen / attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
