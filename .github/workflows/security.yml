# Security-Scans / security scans: SAST, Abhängigkeiten, Secrets, Container.
name: Security
on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # wöchentlich Montag / weekly Monday
# OBEN NUR LESEN, Schreibrechte am Job. (#434)
#
# `security-events: write` brauchen nur die Jobs, die SARIF hochladen — auf Workflow-Ebene
# galt es fuer alle, auch fuer die, die nichts hochladen. Scorecard bemaengelt genau das,
# und die enge Fassung ist ohnehin die ehrlichere Beschreibung dessen, was hier passiert.
#
# Top level read-only; only the jobs that upload SARIF ask for security-events.
permissions:
  contents: read

env:
  # WELCHEN STAND EIN GEPLANTER LAUF PRUEFT (#358): Geplante Laeufe starten IMMER auf dem
  # Standardzweig. Der ist hier `main` — der Release-Zweig, nicht der laufende Stand. Am
  # 2026-08-11 lag `main` 84 Commits hinter `dev`; der Wochenlauf pruefte also einen Baum
  # vom 8. August und meldete zwei Fehlalarme, die auf `dev` laengst per `.gitleaks.toml`
  # erledigt waren. Ein Scan, der ueber einen Stand berichtet, den niemand faehrt, ist
  # schlechter als keiner: gruen ueber ungenutzten Code, rot ueber Behobenes.
  #
  # NICHT ueber den Zeitplan loesbar: Auch die WORKFLOW-DATEI eines geplanten Laufs kommt
  # vom Standardzweig. Deshalb steht der Zweig hier ausdruecklich.
  #
  # Scheduled runs always start on the default branch, which here is the release branch and
  # not what is deployed. A scan reporting on a tree nobody runs is worse than none.
  #
  # VOLLER REF, NICHT NUR DER ZWEIGNAME (#760): CodeQL muss denselben Wert als
  # Upload-Ziel bekommen, und dort ist `refs/heads/<zweig>` verlangt. `checkout` nimmt
  # beide Schreibweisen — die Nicht-Zeitplan-Faelle reichen mit `github.ref` ohnehin
  # schon immer einen vollen Ref durch.
  # Full ref, not the bare branch name: CodeQL needs the same value as its upload target
  # and expects refs/heads/<branch> there. checkout accepts both, and the non-schedule
  # cases have always passed a full ref via github.ref anyway.
  SCAN_REF: ${{ github.event_name == 'schedule' && 'refs/heads/dev' || github.ref }}

jobs:
  codeql:
    permissions:
      contents: read
      security-events: write
    # CodeQL ist auf öffentlichen Repos kostenlos; auf privaten braucht es GHAS.
    # Daher auf privaten Repos überspringen (statt rot). / skipped on private repos.
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.SCAN_REF }}
      # WELCHEN COMMIT DER UPLOAD MELDET (#760): Die Action bindet ihr Ergebnis nicht an
      # den ausgecheckten Baum, sondern an den LAUF. `getCommitOid()` liest zwar
      # `git rev-parse HEAD` aus dem Arbeitsverzeichnis — also `dev` —, `getRef()` gibt
      # aber `GITHUB_REF` unveraendert zurueck, und das ist im geplanten Lauf
      # `refs/heads/main`. Ohne Gegenmassnahme landet die Analyse von `dev` als juengste
      # Analyse fuer `main`, unter einem Commit, der auf `main` gar nicht liegt.
      # `continue-on-error` am Job verschluckt zusaetzlich den Fall, dass GitHub das
      # unstimmige Paar zurueckweist.
      #
      # NUR IM ZEITPLAN gesetzt: Bei `push` und `workflow_dispatch` stimmen `GITHUB_REF`
      # und `GITHUB_SHA` von selbst, und auf PRs wuerde ein ausdruecklicher `ref` die
      # merge-gegen-head-Erkennung der Action ueberspringen. Leere Eingaben sind
      # gefahrlos: `getOptionalInput` macht daraus `undefined`, die Regel „beide oder
      # keins" greift also nicht.
      #
      # The action ties its upload to the run, not to the checked-out tree: the sha comes
      # from the workspace but the ref comes from GITHUB_REF, which on a scheduled run is
      # the default branch. Set both explicitly there, and only there.
      - id: geprueft
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v3
        with:
          ref: ${{ github.event_name == 'schedule' && env.SCAN_REF || '' }}
          sha: ${{ github.event_name == 'schedule' && steps.geprueft.outputs.sha || '' }}

  bandit:
    permissions:
      contents: read
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.SCAN_REF }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install bandit
      - run: bandit -r app.py -ll

  trivy:
    # KEIN `security-events: write` (#762): Dieser Job laedt nichts ins Code-Scanning.
    # `aquasecurity/trivy-action@ed142fd0` hat keinen Upload-Schritt — sie installiert
    # Trivy, waermt den DB-Cache, setzt Umgebungsvariablen und ruft `trivy` auf. Und
    # `format` bleibt hier ungesetzt, steht also auf `table`: Es entsteht nicht einmal ein
    # SARIF. Gemeldet wird ausschliesslich ueber `exit-code: 1`.
    #
    # Die Berechtigung erlaubt das SCHREIBEN von Alarmen — einschleusen wie abraeumen.
    # Ungenutzt gibt sie diese Macht jeder Action in diesen Schritten umsonst. Der Kopf
    # dieser Datei schreibt die Regel seit #434 selbst hin; hier war sie verletzt.
    #
    # No security-events: write — the pinned trivy-action has no upload step and format
    # defaults to `table`, so no SARIF is even produced. The job reports via exit-code only.
    permissions:
      contents: read
    name: Trivy (deps, secrets, misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.SCAN_REF }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  gitleaks:
    permissions:
      contents: read
      pull-requests: read   # liest auf PRs die Commit-Liste / reads PR commits
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.SCAN_REF }}
          fetch-depth: 0
      # WARUM DIE KONFIGURATION AUSDRUECKLICH GESETZT WIRD: Die Action liest `.gitleaks.toml`
      # nicht in jedem Fall von selbst. Ohne den Verweis liefe der Standardsatz weiter und
      # die Ausnahme fuer `.env.example` waere wirkungslos — was man erst am naechsten
      # roten Wochenlauf merkt, also frueherstens in einer Woche. (#343)
      # Set explicitly: without it the default ruleset stays in force and the allowlist
      # would do nothing, which only shows up on the next weekly run.
      #
      # UND DIE DATEI MUSS IN JEDEM GESCANNTEN BAUM LIEGEN, auch auf `main`: Fehlt sie,
      # bricht gitleaks ab, ohne `results.sarif` zu schreiben — die Action scheitert dann
      # beim Hochladen mit `File results.sarif does not exist`, was wie ein Fehler der
      # Action aussieht und keiner ist. Genau so ist der PR gescheitert, der diese
      # Aenderung nach `main` gebracht hat. (#358)
      # The config must exist in every scanned tree, main included: without it gitleaks
      # aborts before writing results.sarif and the action fails on the upload instead,
      # which looks like an action bug and is not one.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  dependency-review:
    permissions:
      contents: read
    # Blockiert PRs, die Abhängigkeiten mit bekannten Schwachstellen einführen.
    # Nur auf PRs (vergleicht Base vs. Head). / Only on PRs.
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v4
        with:
          fail-on-severity: high
