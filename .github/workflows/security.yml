# Security-Scans / security scans: SAST, Abhängigkeiten, Secrets, Container.
name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # wöchentlich Montag / weekly Monday
permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    # CodeQL ist auf öffentlichen Repos kostenlos; auf privaten braucht es GHAS.
    # continue-on-error, damit die private Phase nicht rot wird. / free on public repos.
    name: CodeQL (Python)
    runs-on: [self-hosted, linux]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  bandit:
    name: Bandit (SAST)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r app.py -ll

  trivy:
    name: Trivy (deps, secrets, misconfig)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
