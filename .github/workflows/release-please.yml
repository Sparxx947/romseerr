# Release-Bot / release bot: liest Conventional Commits, pflegt einen Release-PR
# (Version + CHANGELOG) und erstellt bei Merge ein GitHub-Release samt Tag.
name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
