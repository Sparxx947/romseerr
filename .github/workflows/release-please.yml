# Release-Bot / release bot
#
# ZWEIGMODELL: gearbeitet wird auf `dev`, veröffentlicht wird auf `main`.
# Der Bot liest die Conventional Commits auf `dev`, pflegt dort einen Release-PR
# (Version + CHANGELOG) und erstellt beim Merge Tag und GitHub-Release. Danach wird
# `main` auf genau diesen Commit VORGESPULT — deshalb enthält `main` immer den
# aktuellen Release und sonst nichts.
#
# BRANCH MODEL: work happens on `dev`, releases live on `main`. Merging the release PR
# tags a release, and `main` is fast-forwarded to that exact commit — which is why
# `main` only ever contains the current release.
#
# KEIN RELEASE OHNE ENTSCHEIDUNG: Der Release-PR wird als ENTWURF geoeffnet
# (`draft-pull-request` in release-please-config.json). Er zeigt fortlaufend, was ein
# naechster Release enthielte — mehr nicht. GitHub verweigert das Zusammenfuehren eines
# Entwurfs, also entsteht ein Release erst, wenn jemand ihn bewusst auf bereit setzt.
# Der Anlass kommt von aussen, nicht aus dem Takt der Commits.
#
# NO RELEASE WITHOUT A DECISION: the release PR opens as a draft. It previews what the
# next release would contain; GitHub will not merge a draft, so releasing is a
# deliberate act rather than a consequence of pushing.
#
# ABBILD: Der Bau haengt als Job `publish-image` an diesem Workflow, nicht an einem
# `on: release`-Ausloeser im Publish-Workflow. Grund steht dort und bei dem Job.
#
# STOLPERSTELLE: Ein Workflow wird aus dem Baum des Zweigs gelesen, auf den gepusht
# wird — nicht aus dem Standardzweig. Solange auf `main` noch eine aeltere Fassung
# liegt, die auf `main` lauscht, feuert beim Vorspulen DEREN Lauf. Das legte sich von
# selbst, sobald der erste Release die heutige Fassung nach `main` traegt.
# PITFALL: a workflow is read from the tree of the branch pushed to. An older copy
# sitting on `main` will fire when `main` moves; it resolves itself with the first
# release that carries this file to `main`.
name: release-please
on:
  workflow_dispatch:
  push:
    branches: [dev]
# OBEN NUR LESEN. (#434)
#
# Scorecard bemaengelt jedes Schreibrecht auf Workflow-Ebene, und zu Recht: Es gilt fuer
# JEDEN Job der Datei, auch fuer solche, die es nie brauchen. Hier hatten drei der vier
# Jobs ohnehin eigene Bloecke — nur `release-please` selbst lebte vom Vorgabewert.
#
# Top level read-only; the one job that needs to write says so itself.
permissions:
  contents: read

jobs:
  release-please:
    # release-please legt einen PR an und erzeugt beim Zusammenfuehren Release und Tag —
    # dafuer braucht genau dieser Job beides. (#434)
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.releases_created }}
      sha:      ${{ steps.rp.outputs.sha }}
      tag:      ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: rp
        with:
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # `main` nachziehen — erst wenn wirklich ein Release entstanden ist.
  promote:
    name: main auf den Release vorspulen / fast-forward main to the release
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Vorspulen prüfen und ausführen / verify fast-forward, then push
        env:
          SHA: ${{ needs.release-please.outputs.sha }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -eu
          git fetch --no-tags origin main:refs/remotes/origin/main

          # NIEMALS erzwingen. Ist `main` kein Vorfahr des Release-Commits, stimmt eine
          # Annahme dieses Modells nicht mehr — dann soll der Lauf laut scheitern statt
          # Historie zu überschreiben. Genau dafür steht die Sperre gegen Force-Pushes
          # auf `main`: sie schützt auch vor diesem Workflow.
          # NEVER force. If main is not an ancestor, an assumption of this model broke;
          # fail loudly rather than rewrite history.
          if ! git merge-base --is-ancestor origin/main "$SHA"; then
            echo "::error title=Kein Fast-Forward möglich::main ($(git rev-parse --short origin/main)) ist kein Vorfahr von $SHA. Auf main liegt etwas, das nicht über dev kam. / main is not an ancestor of the release commit; something reached main outside dev."
            exit 1
          fi

          echo "main $(git rev-parse --short origin/main) -> $SHA ($TAG)"
          git push origin "$SHA:refs/heads/main"

  # Das Abbild bauen. HIER und nicht ueber `on: release` im Publish-Workflow: ein Release,
  # das dieser Bot mit dem Standard-`GITHUB_TOKEN` anlegt, loest KEINE weiteren Workflows
  # aus. Der Publish-Workflow lauschte darauf und lief deshalb nie — v1.1.0-beta.1 wurde
  # veroeffentlicht und blieb ohne Abbild. Ein PAT haette das auch geloest, kostet aber ein
  # dauerhaftes Geheimnis; ein direkter Aufruf kostet nichts. (#185)
  #
  # EN: built here rather than via `on: release`, because a release created with the
  # default GITHUB_TOKEN triggers no further workflows — so the publish workflow never ran.
  publish-image:
    name: Abbild bauen und veroeffentlichen / build and publish the image
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}

  # Ein Zweig je Release. Der Tag allein genuegt nicht: er ist unveraenderlich, und
  # spaetestens wenn ein alter Stand EINE nachgezogene Korrektur braucht, muss es einen
  # Ort geben, an den sie darf. Ausserdem baut die Referenzinstallation aus einem Klon
  # statt zu ziehen — dort zeigt ein Auschecken auf einen Zweig, nicht auf ein Abbild.
  #
  # A branch per release: a tag cannot take a backport, and the reference installation
  # builds from a clone rather than pulling.
  release-branch:
    name: Zweig zum Release anlegen / create the release branch
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Anlegen, aber niemals verschieben / create, never move
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.release-please.outputs.sha }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -eu
          ZWEIG="release/$TAG"

          # NIEMALS ueberschreiben. Ein vorhandener Release-Zweig kann nachgezogene
          # Korrekturen tragen; ihn auf den Release-Commit zurueckzusetzen wuerfe genau
          # das weg, wofuer es ihn gibt — und zwar lautlos.
          # Never overwrite: an existing release branch may carry backports.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ZWEIG" >/dev/null 2>&1; then
            echo "::notice title=Zweig besteht bereits::$ZWEIG wird nicht angefasst / left untouched"
            exit 0
          fi

          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$ZWEIG" -f "sha=$SHA" >/dev/null
          echo "$ZWEIG -> $SHA"
