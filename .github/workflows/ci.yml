# CI: Lint, Compile, Dockerfile-Lint, Build / lint, compile, dockerfile lint, build
name: CI
on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read

jobs:
  shell:
    name: Shell-Skripte (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # WARUM: Die Skripte des Streaming-Hosts laufen nur IM Container, also koennen die
      # Tests sie nicht ausfuehren. Ein `bash -n` prueft nur die Syntax und uebersieht
      # genau das, was hier schon zugeschlagen hat: eine nicht gesetzte Variable unter
      # `set -u`, die das Skript abbricht, bevor es seine Arbeit tut.
      # These scripts only run inside the container, so tests cannot execute them, and
      # `bash -n` misses the class of bug that already bit: an unset variable under
      # `set -u` aborting the script before it does its work.
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          mapfile -t dateien < <(find contrib -type f \( -name '*.sh' -o -path '*/init/*' \) | sort)
          printf '%s\n' "${dateien[@]}"
          shellcheck --shell=bash --severity=warning "${dateien[@]}"

  lint:
    name: Lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff (critical errors only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Byte-compile
        run: python -m py_compile app.py

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build image
        run: docker build -t romseerr:ci .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pyyaml
      # node ist auf ubuntu-latest vorinstalliert -> der Inline-JS-Guard läuft
      - name: Run pytest
        run: pytest -q
