[pytest]
# WARUM `--cov=.` UND NICHT `--cov=app`: Die Browser- und Vertragstests laden `app.py` ein
# zweites Mal als eigenes Modulobjekt (`app_server`, siehe tests/conftest.py). Mit dem
# Modulnamen als Quelle findet coverage danach gar nichts mehr und meldet „No data was
# collected" — also 0 %, was wie ein kaputter Lauf aussieht und keiner ist. Über den Pfad
# ist die Zuordnung eindeutig.
#
# `--cov=app` resolves by module name and collects nothing once app.py is also loaded as
# `app_server`; the path form is unambiguous.
addopts = -q --cov=. --cov-report=term-missing:skip-covered --cov-fail-under=69

testpaths = tests

markers =
    browser: braucht einen echten Browser (Playwright)

# `xfail(strict=True)` ist überall Pflicht: Ein bekannter Fehler, der still wieder besteht,
# soll auffallen — sonst hält die Suite eine Schuld fest, die längst beglichen ist.
xfail_strict = true
