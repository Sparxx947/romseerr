   d="M14 4h28l10 10v34H10V8a4 4 0 0 1 4-4z
      M21 12v30h7.5v-9h4L38 42h8.5l-6.4-11A7.6 7.6 0 0 0 37 12z
      M28.5 18.5h7.6a3.3 3.3 0 0 1 0 6.6h-7.6z"/>
