<!-- Romseerr — Kleinfassung fuer Lesezeichen und Reiter (#650).
     Kraeftigere Balken als die volle Marke, keine Kontaktpunkte: was bei 16 px ohnehin
     verschwindet, nimmt dort nur Kontrast weg. Reine Pfade — eine Schrift oder ein Emoji
     wird im Favicon nicht geladen und war genau der Fehler der Vorgaengerfassung. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Romseerr">
 <linearGradient id="rs" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ff6a3d"/><stop offset="1" stop-color="#7c5cff"/>
 </linearGradient>
