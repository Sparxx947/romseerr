# Streaming-Host für Romseerr (#71) / streaming host for Romseerr
#
# Emuliert die Plattformen, die der Browser NICHT kann (PS2, GameCube, Wii, Switch):
# der Emulator läuft hier server-seitig mit GPU, der Browser bekommt Bild, Ton und
# schickt Eingaben. Romseerr selbst emuliert nichts — es löst einen Titel auf eine
# Datei auf und bittet den Start-Dienst, sie zu öffnen.
#
# Emulates the platforms a browser cannot (PS2, GameCube, Wii, Switch): the emulator
# runs here with GPU access, the browser receives video and audio and sends input.
#
#   cp .env.example .env    # ausfüllen / fill in
#   docker compose up -d
#
# Alles Weitere steht in README.md — besonders die Stolperstellen, die man sonst
# einzeln durch Messen findet. / See README.md, especially the pitfalls section.

services:
  # ---------------------------------------------------------------- Desktop + Stream
  stream-host:
    image: lscr.io/linuxserver/webtop:${WEBTOP_TAG:-ubuntu-xfce}
    container_name: stream-host
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      TITLE: ${TITLE:-Romseerr Streaming}

      # --- Ton -------------------------------------------------------------------
      # Ohne das versucht Selkies GAR KEIN Audio — der Standard ist "aus", und im
      # Log steht dann schlicht nichts. / Without this Selkies never even attempts
      # audio; the default is off and the log stays silent about it.
      SELKIES_AUDIO_ENABLED: "true"
      SELKIES_AUDIO_DEVICE_NAME: "output.monitor"
      # Die Aufnahmebibliothek beachtet PULSE_RUNTIME_PATH NICHT und scheitert sonst
      # mit "pa_context_connect() failed". / The capture library ignores
      # PULSE_RUNTIME_PATH and otherwise fails with pa_context_connect().
      PULSE_SERVER: "unix:/defaults/native"

      # --- Bildgroesse und Bildrate ------------------------------------------------
      # OHNE DIESE WERTE richtet sich der Stream nach dem Fenster des Browsers. Auf
      # einem grossen Bildschirm sind das schnell 3828x1902 bei 60 fps — und die
      # Bildschirmaufnahme samt Farbkonvertierung kostet dann dauerhaft CPU, die der
      # Emulator besser gebrauchen kann.
      #
      # Gemessen (#167): 3828x1902@60 -> selkies 50 %, Xvfb 41 %.
      #                  1920x1080@30 -> selkies 13 %, Xvfb  7 %.
      # Ein Drittel weniger Gesamtlast fuer dasselbe Bild.
      #
      # EHRLICH DAZU: Es macht den Emulator NICHT schneller. Dessen Video-Thread ist
      # unabhaengig von Aufloesung und Bildrate ausgelastet — die Kosten fallen pro
      # Frame und pro Zeichenbefehl an, nicht pro Pixel. Es entlastet den HOST.
      #
      # Measured: dropping to 1920x1080@30 cuts capture cost by about two thirds. It
      # does not speed up the emulator; its video thread saturates regardless.
      #
      # 1920x1080 reicht fuer Konsolen, die nativ deutlich darunter liegen (GameCube
      # 640x528, PS2 640x448). 30 fps, weil die meisten Titel ohnehin nicht mehr
      # liefern. Wer mehr will, setzt es hier hoch.
      SELKIES_MANUAL_WIDTH: "${STREAM_WIDTH:-1920}"
      SELKIES_MANUAL_HEIGHT: "${STREAM_HEIGHT:-1080}"
      SELKIES_FRAMERATE: "${STREAM_FRAMERATE:-30}"

      # --- was die Init-Skripte brauchen / what the init scripts read ------------
      # Ohne diese Zeilen laufen die Skripte mit leeren Variablen: der Start-Dienst
      # verweigert mangels Token den Start, und die Emulatoren werden nicht geholt.
      # Ein Compose reicht NICHT automatisch durch, was in .env steht.
      # Without these the scripts see empty values: the launch service refuses to
      # start for lack of a token and no emulator is fetched. Compose does not pass
      # .env into the container by itself.
      STREAM_AGENT_TOKEN: ${STREAM_AGENT_TOKEN:?STREAM_AGENT_TOKEN fehlt - siehe .env.example}
      AGENT_PORT: ${AGENT_PORT:-8901}
      INSTALL_PCSX2: ${INSTALL_PCSX2:-false}
      INSTALL_DOLPHIN: ${INSTALL_DOLPHIN:-false}
      INSTALL_FLYCAST: ${INSTALL_FLYCAST:-false}
      INSTALL_XEMU: ${INSTALL_XEMU:-false}
      INSTALL_CEMU: ${INSTALL_CEMU:-false}
      INSTALL_AZAHAR: ${INSTALL_AZAHAR:-false}
      INSTALL_VITA3K: ${INSTALL_VITA3K:-false}
      INSTALL_RPCS3: ${INSTALL_RPCS3:-false}
      RPCS3_URL: ${RPCS3_URL:-}
      INSTALL_SWITCH_EMU: ${INSTALL_SWITCH_EMU:-false}
      SWITCH_EMU_URL: ${SWITCH_EMU_URL:-}
      SWITCH_EMU_API: ${SWITCH_EMU_API:-}
      SWITCH_EMU_ASSET: ${SWITCH_EMU_ASSET:-}
      EMU_AUTO_UPDATE: ${EMU_AUTO_UPDATE:-true}
      # Feste Versionen (Downgrade). Leer = jeweils neueste Fassung.
      # Pinned versions (downgrade). Empty = latest release.
      PCSX2_URL: ${PCSX2_URL:-}
      FLYCAST_URL: ${FLYCAST_URL:-}
      XEMU_URL: ${XEMU_URL:-}
      CEMU_URL: ${CEMU_URL:-}
      AZAHAR_URL: ${AZAHAR_URL:-}
      VITA3K_URL: ${VITA3K_URL:-}
      VGL_VERSION: ${VGL_VERSION:-3.1.4}

      # --- DRI3 fuer den X-Server -------------------------------------------------
      # Der X-Dienst des Abbilds KANN DRI3, sucht dafuer aber fest nach
      # /dev/dri/renderD128. Haengt die Karte woanders (hier: renderD129), greift die
      # Erkennung nie: Xvfb laeuft ohne GPU-Knoten, DRI3 fehlt, und Vulkan kann gar
      # nicht praesentieren ("No DRI3 support detected - required for presentation").
      # Genau deshalb war VirtualGL ueberhaupt noetig.
      #
      # Nachgemessen (#169): mit diesem Knoten meldet derselbe Xvfb DRI3, vulkaninfo
      # eine praesentierfaehige Oberflaeche, und Dolphins Video-Thread faellt von
      # "saettigt einen Kern" auf 14 % — ohne VirtualGL im Prozess.
      #
      # EN: the image's X service supports DRI3 but hard-codes renderD128; point it at
      # the actual render node and Vulkan can present, dropping VirtualGL entirely.
      DRINODE: ${DRI_RENDER_NODE}
      # Grenze fuer eine hochgeladene Firmware-Datei (Sonys PS3-Paket ist ~200 MB).
      FIRMWARE_MAX_BYTES: ${FIRMWARE_MAX_BYTES:-536870912}
    volumes:
      - ${CONFIG_DIR:-./data}/config:/config
      # Init-Skripte MÜSSEN hierhin — /config/custom-cont-init.d wird ignoriert.
      # Init scripts MUST be mounted here; /config/custom-cont-init.d is ignored.
      - ./init:/custom-cont-init.d:ro
      # Der Start-Dienst wird EINGEHAENGT, nicht kopiert. Sonst laeuft nach einem
      # Update des Repos weiter die alte Fassung — und zwar lautlos.
      # Mounted, not copied: otherwise an outdated copy keeps running silently.
      - ./stream-agent.py:/opt/stream-agent.py:ro
      # Bruecke Selkies-Sockets -> echte Kernel-Geraete (#119). Wie der Start-Dienst als
      # Datei eingehaengt: sonst liegt sie nur im Container-Dateisystem und ist beim
      # naechsten Neuerstellen weg. Noch KEIN Dienst — sie wird von Hand gestartet, bis
      # Selkies' eigene Interposer-Geraete abgeschaltet sind.
      # EN: mounted like the launch service so it does not live only inside the container.
      # Not a service yet; started by hand until Selkies' own fake devices are disabled.
      - ./selkies-uinput-bridge.py:/opt/selkies-uinput-bridge.py:ro
      # Startprofil je Emulator: Controller-Belegung und regionsrichtiges BIOS (#119).
      # Eingehaengt, damit das, was laeuft, immer das ist, was im Repo steht.
      - ./launch-profile.py:/opt/launch-profile.py:ro
      # Pruefseite fuer den Controller (#133), erreichbar unter /gamepad-check.html —
      # ohne Entwicklerwerkzeuge, die auf der Stream-Seite gar nicht zu oeffnen sind.
      #
      # NACH /opt UND NICHT IN DIE WEB-WURZEL: Das Basis-Image raeumt beim Start
      # `/usr/share/selkies/web` per `rm -Rf` weg und legt das Dashboard neu hin. Ein
      # Bind-Mount dort hinein laesst das `rm` scheitern, das folgende `cp -a` kopiert
      # dann eine Ebene ZU TIEF, und die Wurzel bleibt ohne index.html — nginx
      # antwortet 403 und der Stream startet nie. init/05-web kopiert die Datei
      # deshalb nach dem Image-Init an ihren Platz.
      # Mounting into the web root makes the image's `rm -Rf` fail and nests the
      # dashboard one level down; init/05-web copies this file in afterwards instead.
      - ./web/gamepad-check.html:/opt/gamepad-check.html:ro
      # Die ROM-Bibliothek nur lesend. / The ROM library, read-only.
      - ${ROMS_DIR:?ROMS_DIR fehlt - siehe .env.example}:/roms:ro
    devices:
      # Der Emulator braucht eine GPU. Beide Knoten derselben Karte angeben:
      # den Render-Knoten UND den Card-Knoten — VirtualGL will letzteren.
      # Give BOTH nodes of the same card: VirtualGL needs the card node.
      - ${DRI_RENDER_NODE:?DRI_RENDER_NODE fehlt}:${DRI_RENDER_NODE}
      # Gamepads als ECHTE Kernel-Geraete (#119). Selkies reicht sie sonst ueber einen
      # LD_PRELOAD-Interposer weiter — und auf die Emulatoren hier wirkt LD_PRELOAD
      # NICHT, weil ihre AppImage-Runtime statisch gelinkt ist (`AppRun` ist static-pie;
      # gemessen: im laufenden Emulator ist kein Interposer geladen und er sieht null
      # Eingabegeraete). Ueber uinput entstehen Geraete, die jeder Prozess sieht.
      #
      # Das Modul muss auf dem HOST geladen sein, sonst existiert /dev/uinput zwar,
      # /proc/misc kennt es aber nicht und open() scheitert.
      #
      # EN: real kernel devices for gamepads; LD_PRELOAD cannot reach a statically
      # linked AppImage runtime. Requires the uinput module loaded on the host.
      - /dev/uinput:/dev/uinput
      - ${DRI_CARD_NODE:?DRI_CARD_NODE fehlt}:${DRI_CARD_NODE}
    shm_size: ${SHM_SIZE:-2g}
    ports:
      # HTTP — nur für den ersten Blick. Ton und Gamepad brauchen HTTPS (s. README).
      # HTTP is for a first look only; audio and gamepad require HTTPS.
      - "${HTTP_PORT:-8900}:3000"
      - "${HTTPS_PORT:-8902}:3001"
      # Start-Dienst, den Romseerr aufruft. / Launch service Romseerr calls.
      - "${AGENT_PORT:-8901}:${AGENT_PORT:-8901}"

  # ------------------------------------------------- Zertifikat (optional, aber empfohlen)
  # Holt und erneuert ein Zertifikat per DNS-01 und legt es dorthin, wo der
  # Streaming-Host es liest. Kein Docker-Socket, kein Host-Cron: der Stack versorgt
  # sich selbst. Wer ein eigenes Zertifikat mitbringt, lässt diesen Dienst weg
  # (`docker compose up -d stream-host`) und legt cert.pem/cert.key selbst ab.
  #
  # Fetches and renews a certificate via DNS-01 and drops it where the streaming host
  # reads it. No Docker socket, no host cron. Bring your own certificate instead by
  # starting only `stream-host` and placing cert.pem/cert.key yourself.
  stream-certbot:
    image: certbot/dns-${DNS_PLUGIN:-cloudflare}
    container_name: stream-certbot
    restart: unless-stopped
    profiles: ["acme"]
    entrypoint: ["/bin/sh", "/renew.sh"]
    environment:
      CERT_DOMAIN: ${CERT_DOMAIN:?CERT_DOMAIN fehlt}
      CERT_EMAIL: ${CERT_EMAIL:?CERT_EMAIL fehlt}
      DNS_PLUGIN: ${DNS_PLUGIN:-cloudflare}
      PROPAGATION_SECONDS: ${PROPAGATION_SECONDS:-30}
      RENEW_INTERVAL: ${RENEW_INTERVAL:-43200}
      OWNER_UID: ${PUID:-1000}
      OWNER_GID: ${PGID:-1000}
    volumes:
      - ${CONFIG_DIR:-./data}/letsencrypt/etc:/etc/letsencrypt
      - ${CONFIG_DIR:-./data}/letsencrypt/var:/var/lib/letsencrypt
      # Die Zugangsdatei des DNS-Anbieters — NUR lesend, und niemals in dieses Repo.
      # The DNS provider credentials file, read-only, and never in this repository.
      - ${DNS_CREDENTIALS_FILE:?DNS_CREDENTIALS_FILE fehlt}:/creds/dns.ini:ro
      # Zielordner, aus dem der Streaming-Host sein Zertifikat liest.
      - ${CONFIG_DIR:-./data}/config/ssl:/ssl
      - ./renew.sh:/renew.sh:ro
