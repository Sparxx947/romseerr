<!doctype html><html lang=de><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>Romseerr</title>
<link rel=manifest href="/manifest.webmanifest"><meta name=theme-color content="#0b0d10"><link rel=icon href="/icon.svg">
<link rel=stylesheet href="__ASSET:css/index.css__"></head><body>
<div id=side>
 <div class=logo>🎮 Romseerr</div>
 <a class="nav on" id=nS data-i18n=nav_discover onclick="show('s')">🔍 Entdecken</a>
 <!-- Kein Symbol davor: `nav_requests` bringt sein eigenes mit ("📥 Anfragen"). Sonst
      steht es zweimal da — derselbe Fallstrick wie beim Zustandsabzeichen in #205. -->
 <a class=nav id=nJ onclick="show('j')"><span data-i18n=nav_requests>📥 Anfragen</span><span id=jobbadge></span></a>
 <a class=nav id=nI data-i18n=nav_issues onclick="show('issues')">🐞 Probleme</a>
 <a class=nav id=nC data-i18n=nav_coverage onclick="show('cov')">📊 Abdeckung</a>
 <a class=nav id=nM onclick="show('msg')">✉ <span data-i18n=nav_messages>Nachrichten</span><span id=msgbadge></span></a>
 <a class=nav id=nSet data-i18n=nav_settings onclick="show('set')" style="display:none">⚙️ Einstellungen</a>
</div>
<main>
 <!-- Konfigurationswarnungen: nur für Verwalter, nur wenn etwas kaputt ist. Ein Weg,
      der gar nicht erst starten kann, gehört hierhin und nicht ausschließlich ins Log. (#197) -->
 <div id=cfgwarn style="display:none"></div>
 <div id=topbar>
  <input id=q data-i18n-ph=search_ph placeholder="Spiel suchen … (Enter)" autofocus>
  <button class=fbtn id=tF onclick="toggleFilter()">🎛 Plattformen: Alle</button>
  <button class=fbtn id=tRA onclick="toggleRA()" title="RetroAchievements">🏆</button>
  <!-- Alles, was zur PERSON gehört, steht oben rechts — dort wird es gesucht. Vorher lag
       es unten links und kostete drei Dauerzeilen für selten Benutztes. (#206) -->
  <div class=kopfrechts>
   <div class=aufklapp id=langbox>
    <button class=fbtn id=langbtn onclick="toggleMenu('langmenu',event)" aria-haspopup=true aria-expanded=false></button>
    <div class=menu id=langmenu></div>
   </div>
   <div class=aufklapp id=userbox>
    <button class=fbtn id=userbtn onclick="toggleMenu('usermenu',event)" aria-haspopup=true aria-expanded=false></button>
    <div class=menu id=usermenu>
     <a class=mitem data-i18n=profile onclick="closeMenus();openProfile()">👤 Profil</a>
     <!-- Wunschliste und Favoriten gehören zur Person, nicht zu den Anfragen (#195/#207) -->
     <a class=mitem data-i18n=nav_lists onclick="closeMenus();show('lists')">⭐ Meine Listen</a>
     <a class=mitem data-i18n=logout onclick="closeMenus();logout()">🚪 Abmelden</a>
    </div>
   </div>
  </div>
 </div>
 <div id=filter></div>
 <div id=discview><div id=grid></div><div class=hint id=hint data-i18n=hint_type>Tippe einen Titel und drücke Enter.</div></div>
 <div id=jobs></div>
 <div id=settings></div>
 <div id=issues></div>
 <div id=messages></div>
 <div id=coverage></div>
 <div id=lists></div>
 <!-- Fußzeile (#208): die Version stand nur unter Einstellungen → Über, also hinter zwei
      Klicks und nur für Verwalter. Damit trägt jetzt jeder Bildschirmauszug seinen Stand —
      genau das fehlte an dem Tag, an dem ein veralteter Bau einen Arbeitstag gekostet hat
      (#129). Nicht klebend, damit sie auf dem Telefon keinen Platz frisst. -->
 <footer id=fuss></footer>
</main>
<div id=modal></div>
<script src="__ASSET:js/index.js__"></script></body></html>
